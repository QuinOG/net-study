<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1b34" />
    <meta name="description" content="NetQuest networking education application" />
    <link rel="manifest" href="/manifest.json" />
    <title>NetQuest</title>
    <script data-theme-bootstrap>
      (() => {
        const key = 'net-study-settings-theme';
        const legacyKey = 'net-study-settings-darkMode';
        const valid = ['system', 'dark', 'light'];
        let preference = null;
        try { preference = localStorage.getItem(key); } catch (_) { preference = 'system'; }
        if (!valid.includes(preference)) {
          if (preference !== null) {
            preference = 'system';
          } else {
            try {
              const legacy = localStorage.getItem(legacyKey);
              preference = legacy === 'true' ? 'dark' : legacy === 'false' ? 'light' : 'system';
              if (legacy === 'true' || legacy === 'false') localStorage.removeItem(legacyKey);
            } catch (_) { preference = 'system'; }
          }
          try { localStorage.setItem(key, preference); } catch (_) {}
        }
        let dark = false;
        try { dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (_) {}
        const resolved = preference === 'system' ? (dark ? 'dark' : 'light') : preference;
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>

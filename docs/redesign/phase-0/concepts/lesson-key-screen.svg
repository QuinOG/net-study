<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">NetQuest lesson key screen</title><desc id="desc">A high fidelity light-mode lesson concept with section navigation, reading progress, calm typography, code sample, and next section action.</desc>
  <defs><style>.ui{font-family:Inter,Arial,sans-serif}.mono{font-family:'IBM Plex Mono',Consolas,monospace}.muted{fill:#5d7188}.card{fill:#fff;stroke:#d7e2ec}.small{font-size:12px}</style></defs>
  <rect width="1440" height="1024" fill="#f4f8fc"/>
  <g class="ui">
    <rect width="1440" height="76" fill="#ffffff"/><line y1="76" x2="1440" y2="76" stroke="#d7e2ec"/><g transform="translate(34 20)"><circle cx="18" cy="18" r="17" fill="#e7f8fd" stroke="#0a91b7"/><text x="48" y="25" fill="#0b1d31" font-size="21" font-weight="800">NetQuest</text></g><text x="720" y="35" text-anchor="middle" fill="#0b1d31" font-size="14" font-weight="700">Introduction to Networking Concepts</text><text x="720" y="56" text-anchor="middle" class="muted small">LESSON 1 OF 5</text><rect x="1260" y="18" width="144" height="40" rx="9" fill="none" stroke="#9eb1c2"/><text x="1332" y="43" text-anchor="middle" fill="#354b61" font-size="13" font-weight="700">Exit lesson</text>

    <rect x="0" y="76" width="300" height="948" fill="#f9fbfd"/><line x1="300" x2="300" y1="76" y2="1024" stroke="#d7e2ec"/><text x="32" y="124" class="muted small" font-weight="700" letter-spacing="1.2">LESSON SECTIONS</text>
    <g transform="translate(20 146)"><rect width="260" height="48" rx="9" fill="#e8f7fc"/><circle cx="24" cy="24" r="9" fill="#0a91b7"/><path d="m20 24 3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="48" y="29" fill="#0b4760" font-size="14" font-weight="700">Overview</text><text x="24" y="78" text-anchor="middle" fill="#39a578">✓</text><text x="48" y="82" fill="#526a80" font-size="14">Why networks matter</text><text x="24" y="132" text-anchor="middle" fill="#0a91b7">●</text><text x="48" y="136" fill="#0b1d31" font-size="14" font-weight="700">Core components</text><text x="24" y="186" text-anchor="middle" fill="#91a5b8">○</text><text x="48" y="190" fill="#526a80" font-size="14">Network examples</text><text x="24" y="240" text-anchor="middle" fill="#91a5b8">○</text><text x="48" y="244" fill="#526a80" font-size="14">Knowledge check</text></g>
    <g transform="translate(20 884)"><rect width="260" height="104" rx="12" fill="#fff" stroke="#d7e2ec"/><text x="18" y="28" class="muted small" font-weight="700">LESSON PROGRESS</text><text x="224" y="28" text-anchor="end" fill="#0a91b7" class="mono small">45%</text><rect x="18" y="45" width="224" height="7" rx="4" fill="#e2eaf1"/><rect x="18" y="45" width="101" height="7" rx="4" fill="#22b978"/><text x="18" y="78" class="muted small">~12 minutes remaining</text></g>

    <g transform="translate(372 112)"><text fill="#0a91b7" class="mono small" font-weight="700">MODULE 1 · FOUNDATIONAL</text><text y="54" fill="#0b1d31" font-size="36" font-weight="800">What is a computer network?</text><text y="87" class="muted" font-size="17">How connected devices exchange information—and why that matters.</text><g transform="translate(0 116)"><rect width="104" height="30" rx="15" fill="#e8f7fc"/><text x="52" y="20" text-anchor="middle" fill="#0b6f90" class="small" font-weight="700">20–25 MIN</text><rect x="116" width="94" height="30" rx="15" fill="#e8f6ee"/><text x="163" y="20" text-anchor="middle" fill="#24764f" class="small" font-weight="700">100 XP</text><rect x="222" width="102" height="30" rx="15" fill="#f0f3f7"/><text x="273" y="20" text-anchor="middle" fill="#536b81" class="small" font-weight="700">BEGINNER</text></g>
      <line y1="174" x2="800" y2="174" stroke="#d7e2ec"/>
      <text y="228" fill="#0b1d31" font-size="25" font-weight="800">Core components</text>
      <text y="270" fill="#354b61" font-size="16">Every network starts with devices that can send, receive, or forward data.</text><text y="298" fill="#354b61" font-size="16">Those devices follow shared rules—protocols—so each packet can reach the</text><text y="326" fill="#354b61" font-size="16">right destination and be understood when it arrives.</text>
      <g transform="translate(0 362)"><rect class="card" width="800" height="126" rx="14"/><circle cx="38" cy="40" r="17" fill="#e7f8fd"/><text x="38" y="45" text-anchor="middle" fill="#0a91b7" font-weight="800">1</text><text x="68" y="38" fill="#0b1d31" font-size="16" font-weight="800">Endpoints</text><text x="68" y="64" class="muted" font-size="14">Clients, servers, phones, sensors, and other devices that produce or consume data.</text><text x="38" y="101" text-anchor="middle" fill="#0a91b7" font-weight="800">2</text><text x="68" y="100" fill="#0b1d31" font-size="16" font-weight="800">Intermediary devices</text><text x="276" y="100" class="muted" font-size="14">Switches and routers that move data toward its destination.</text></g>
      <text y="542" fill="#0b1d31" font-size="21" font-weight="800">A packet's route</text><text y="575" fill="#354b61" font-size="16">Use <tspan class="mono" fill="#0b6f90">traceroute</tspan> to inspect the hops between your device and a destination.</text>
      <g transform="translate(0 600)"><rect width="800" height="154" rx="14" fill="#0c1928"/><rect width="800" height="34" rx="14" fill="#13283d"/><circle cx="20" cy="17" r="4" fill="#ff6b6b"/><circle cx="34" cy="17" r="4" fill="#ffbd4a"/><circle cx="48" cy="17" r="4" fill="#39d98a"/><text x="772" y="22" text-anchor="end" fill="#8ea4bd" class="mono small">COPY</text><text x="22" y="68" fill="#6fddff" class="mono" font-size="14">$ traceroute example.net</text><text x="22" y="96" fill="#b9cadd" class="mono" font-size="13">1  192.168.1.1     1.42 ms</text><text x="22" y="120" fill="#b9cadd" class="mono" font-size="13">2  10.24.0.1        8.16 ms</text><text x="22" y="144" fill="#b9cadd" class="mono" font-size="13">3  example.net     21.07 ms</text></g>
      <g transform="translate(0 788)"><rect width="800" height="78" rx="14" fill="#eef8f3" stroke="#b9dfca"/><circle cx="34" cy="39" r="14" fill="#39d98a"/><text x="34" y="44" text-anchor="middle" fill="#083b26" font-weight="800">i</text><text x="62" y="31" fill="#174f37" font-size="14" font-weight="800">Key idea</text><text x="62" y="54" fill="#3b6552" font-size="13">The path can change, but protocols keep communication predictable.</text></g>
      <g transform="translate(0 896)"><text y="27" fill="#5d7188" font-size="13">Section 3 of 5</text><rect x="604" width="196" height="46" rx="10" fill="#0a91b7"/><text x="702" y="29" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">Next section  →</text></g>
    </g>
    <text x="1120" y="990" class="muted small">Directional high-fidelity concept · light theme · not production UI</text>
  </g>
</svg>
